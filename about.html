<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function driveDl(u){if(!u)return'';var m=String(u).match(/\/file\/d\/([\w-]+)/)||String(u).match(/[?&]id=([\w-]+)/);return m?'https://drive.google.com/uc?export=download&id='+m[1]:u;}


/* ===== تحميل ذهبي مع نسبة مئوية — بدون فتح أي رابط ===== */
function ensureDlModal(){
  var bg=document.getElementById('dlModalBg');
  if(bg) return bg;
  bg=document.createElement('div');
  bg.id='dlModalBg';
  bg.className='dl-modal-bg';
  bg.innerHTML=
    '<div class="dl-modal" role="dialog" aria-modal="true">'+
      '<div class="dl-modal-icon"><i class="fas fa-download"></i></div>'+
      '<div class="dl-modal-title" id="dlModalTitle">جاري التحميل</div>'+
      '<div class="dl-modal-sub" id="dlModalSub"></div>'+
      '<div class="dl-track"><div class="dl-fill" id="dlFill"></div></div>'+
      '<div class="dl-pct" id="dlPct">0%</div>'+
      '<div class="dl-modal-hint" id="dlHint">لا تغلق الصفحة حتى يكتمل التحميل</div>'+
    '</div>';
  document.body.appendChild(bg);
  return bg;
}
function setDlProgress(p){
  p=Math.max(0,Math.min(100,Math.round(p)));
  var fill=document.getElementById('dlFill');
  var pct=document.getElementById('dlPct');
  if(fill) fill.style.width=p+'%';
  if(pct) pct.textContent=p+'%';
}
function closeDlModal(delay){
  setTimeout(function(){
    var bg=document.getElementById('dlModalBg');
    if(bg) bg.classList.remove('open');
    setDlProgress(0);
  }, delay||400);
}
function triggerBlobDownload(blob, filename){
  var a=document.createElement('a');
  var u=URL.createObjectURL(blob);
  a.href=u;
  a.download=filename||'download';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 2000);
}
/** تحميل صامت بدون فتح تبويب أو تغيير الصفحة */
function silentUrlDownload(url, filename){
  // 1) محاولة رابط بنفس الصفحة بدون target
  try{
    var a=document.createElement('a');
    a.href=url;
    a.setAttribute('download', filename||'file');
    a.style.display='none';
    a.rel='noopener';
    // ممنوع target=_blank عشان ميفتحش درايف
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ a.remove(); }, 1000);
  }catch(e){}
  // 2) iframe مخفي كاحتياطي (يفضل التحميل بدون ما المستخدم يشوف الصفحة)
  try{
    var old=document.getElementById('silentDlFrame');
    if(old) old.remove();
    var ifr=document.createElement('iframe');
    ifr.id='silentDlFrame';
    ifr.style.cssText='position:fixed;width:0;height:0;border:0;opacity:0;pointer-events:none;left:-9999px;top:-9999px';
    ifr.setAttribute('aria-hidden','true');
    ifr.src=url;
    document.body.appendChild(ifr);
    setTimeout(function(){ try{ ifr.remove(); }catch(e){} }, 60000);
  }catch(e){}
}
function guessFilename(url, title){
  if(title){
    var t=String(title).replace(/[\\/:*?"<>|]+/g,'_').trim();
    if(t && t!=='تحميل' && t.indexOf('fa-')<0) return t;
  }
  try{
    var u=new URL(url, location.href);
    var last=(u.pathname.split('/').pop()||'').split('?')[0];
    if(last && last.indexOf('.')>0) return decodeURIComponent(last);
  }catch(e){}
  return 'download';
}
function driveDirectUrl(u){
  if(!u) return '';
  u=String(u);
  var m=u.match(/\/file\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
  if(m){
    var id=m[1];
    // رابط تحميل مباشر قدر الإمكان بدون صفحة معاينة
    return 'https://drive.usercontent.google.com/download?id='+id+'&export=download&confirm=t';
  }
  if(typeof driveDl==='function') return driveDl(u);
  return u;
}
/** نافذة تحميل ذهبية — بدون التنقل لأي رابط */
function goldenDownload(url, title){
  if(!url){ if(typeof toast==='function') toast('لا يوجد رابط تحميل'); return; }
  var raw=url;
  url=driveDirectUrl(url);
  var name=guessFilename(url, title);
  var bg=ensureDlModal();
  document.getElementById('dlModalTitle').textContent='جاري التحميل';
  document.getElementById('dlModalSub').textContent=title||name;
  document.getElementById('dlHint').textContent='التحميل داخل الموقع — بدون فتح روابط';
  setDlProgress(0);
  bg.classList.add('open');

  var finished=false;
  function doneOk(){
    if(finished) return;
    finished=true;
    setDlProgress(100);
    document.getElementById('dlModalTitle').textContent='تم التحميل';
    document.getElementById('dlHint').textContent='اكتمل بنجاح';
    closeDlModal(900);
  }
  function doneSilent(){
    if(finished) return;
    finished=true;
    setDlProgress(100);
    document.getElementById('dlModalTitle').textContent='تم بدء التحميل';
    document.getElementById('dlHint').textContent='الملف بينزل على جهازك';
    silentUrlDownload(url, name);
    closeDlModal(1200);
  }

  try{
    var xhr=new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType='blob';
    xhr.withCredentials=false;
    xhr.onprogress=function(e){
      if(e.lengthComputable && e.total>0){
        setDlProgress((e.loaded/e.total)*100);
      } else if(e.loaded){
        var cur=parseInt((document.getElementById('dlPct').textContent||'0'),10)||0;
        if(cur<90) setDlProgress(Math.min(90, cur+2));
      }
    };
    xhr.onload=function(){
      if(xhr.status>=200 && xhr.status<300 && xhr.response){
        var type=(xhr.getResponseHeader('Content-Type')||'').toLowerCase();
        // لو رجع HTML (صفحة تأكيد درايف) نكمل صامت بدون فتح تبويب
        if(type.indexOf('text/html')>=0 || (xhr.response.size && xhr.response.size<5000 && type.indexOf('application')<0 && type.indexOf('zip')<0 && type.indexOf('octet')<0)){
          // جرب الرابط الأصلي uc كمان صامت
          silentUrlDownload(url, name);
          doneOk();
          return;
        }
        var disp=xhr.getResponseHeader('Content-Disposition')||'';
        var m=disp.match(/filename\*?=(?:UTF-8''|")?([^\";]+)/i);
        var fn=name;
        if(m&&m[1]) try{ fn=decodeURIComponent(m[1].replace(/"/g,'').trim()); }catch(e){}
        triggerBlobDownload(xhr.response, fn);
        doneOk();
      } else {
        doneSilent();
      }
    };
    xhr.onerror=function(){ doneSilent(); };
    xhr.ontimeout=function(){ doneSilent(); };
    xhr.timeout=180000;
    xhr.send();

    var fake=6;
    var iv=setInterval(function(){
      if(finished){ clearInterval(iv); return; }
      var cur=parseInt((document.getElementById('dlPct').textContent||'0'),10)||0;
      if(cur<88){
        fake += Math.max(1, Math.round((90-fake)*0.045));
        if(cur<fake) setDlProgress(fake);
      }
    }, 180);
  }catch(err){
    doneSilent();
  }
}
window.goldenDownload = goldenDownload;

function wireGoldenDownloads(root){
  root = root || document;
  // فقط روابط التحميل الحقيقية — مش كل الأزرار
  var nodes = root.querySelectorAll('a[download], a#engDl, a[href*="export=download"], a[href*="drive.google.com"], a[href*="drive.usercontent"], a[href*="uc?export"], [data-download-url]');
  nodes.forEach(function(a){
    if(a._goldDl) return;
    var href=(a.getAttribute('href')||a.getAttribute('data-download-url')||'').trim();
    if(!href || href==='#' || href.indexOf('javascript:')===0) return;
    // تجاهل صفحات الموقع الداخلية
    if(/\.html($|\?|#)/i.test(href) && href.indexOf('drive')<0 && href.indexOf('export')<0 && href.indexOf('usercontent')<0) return;
    a._goldDl=1;
    a.removeAttribute('target');
    a.addEventListener('click', function(e){
      var u=(a.getAttribute('href')||a.getAttribute('data-download-url')||'').trim();
      if(!u || u==='#') return;
      e.preventDefault();
      e.stopPropagation();
      var title=(a.getAttribute('data-dl-title')||a.getAttribute('title')||'').replace(/\s+/g,' ').trim();
      if(!title) title=(a.textContent||'').replace(/\s+/g,' ').trim();
      if(title.length>60) title=title.slice(0,57)+'…';
      goldenDownload(u, title);
    });
  });
}

function glassModal(title, html){
  var bd=document.getElementById('glassBd');
  if(!bd){
    bd=document.createElement('div'); bd.id='glassBd'; bd.className='glass-modal-backdrop';
    bd.innerHTML='<div class="glass-modal" role="dialog"><div class="d-flex justify-content-between align-items-start gap-2 mb-2"><h3 id="glassTitle"></h3><button type="button" class="btn btn-sm btn-outline-secondary" id="glassClose">إغلاق</button></div><div id="glassBody"></div></div>';
    document.body.appendChild(bd);
    bd.addEventListener('click',function(e){ if(e.target===bd) bd.classList.remove('open'); });
    document.getElementById('glassClose').onclick=function(){ bd.classList.remove('open'); };
  }
  document.getElementById('glassTitle').textContent=title||'';
  document.getElementById('glassBody').innerHTML=html||'';
  bd.classList.add('open');
}


function copyText(t, btn){
  t=String(t||'');
  function ok(){ if(btn){ btn.classList.add('ok'); btn.innerHTML='<i class="fas fa-check"></i>'; setTimeout(function(){ btn.classList.remove('ok'); btn.innerHTML='<i class="fas fa-copy"></i>'; },1200);} }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok).catch(function(){ fallback(); });
  } else fallback();
  function fallback(){
    var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); ok(); }catch(e){}
    document.body.removeChild(a);
  }
}
function idCopyHtml(id){
  return '<span class="id-with-copy"><code class="mono" style="direction:ltr">'+esc(id)+'</code> <button type="button" class="btn-copy-id" title="نسخ" data-copy="'+esc(id)+'"><i class="fas fa-copy"></i></button></span>';
}
function wireCopy(root){
  (root||document).querySelectorAll('[data-copy]').forEach(function(b){
    if(b._copyBound) return; b._copyBound=true;
    b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); copyText(b.getAttribute('data-copy'), b); };
  });
}

function deviceId(){
  var k='misran_device_id', ko='misran_device_id_original';
  try{
    var v=localStorage.getItem(k);
    if(v&&v.length>10) return v;
    var id='u_'+Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    localStorage.setItem(k,id);
    if(!localStorage.getItem(ko)) localStorage.setItem(ko,id);
    return id;
  }catch(e){
    return 'u_tmp_'+Date.now().toString(36)+Math.random().toString(36).slice(2);
  }
}
function userEntitlements(){
  var d=window.SITE_DATA||{};
  var map=d.entitlements||{};
  return map[deviceId()]||[];

function userOwns(productId){

}

function renderUserChip(){
  var old=document.getElementById('userChip'); if(old) old.remove();
  var id=deviceId();
  var chip=document.createElement('div');
  chip.id='userChip'; chip.className='user-chip';
  chip.innerHTML=
    '<div class="user-chip-inner">'+
      '<div class="user-avatar"><i class="fas fa-user"></i></div>'+
      '<span class="user-badge">منشئ</span>'+
      '<span class="id-with-copy"><span class="user-id" id="idText"></span>'+
      '<button type="button" class="btn-copy-id" id="btnCopyId" title="نسخ ID"><i class="fas fa-copy"></i></button></span>'+
      '<button type="button" class="btn-copy-id" id="btnGear" title="الحساب"><i class="fas fa-cog"></i></button>'+
      '<button type="button" class="btn btn-outline-secondary btn-sm" id="btnMyProducts">منتجاتي</button>'+
    '</div>'+
    '<button type="button" class="user-chip-toggle" id="btnChipToggle" title="عرض حسابي"><i class="fas fa-chevron-left"></i><span class="chip-toggle-label">عرض حسابي</span></button>';
  document.body.appendChild(chip);
  document.getElementById('idText').textContent=id;
  document.getElementById('btnCopyId').setAttribute('data-copy', id);
  document.getElementById('btnCopyId').onclick=function(){ copyText(id, this); };

  function applyCollapsed(on){

    var ic=chip.querySelector('#btnChipToggle i');
    var lab=chip.querySelector('.chip-toggle-label');
    if(ic) ic.className = on ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
    if(lab) lab.style.display = on ? '' : 'none';
    try{ localStorage.setItem('misran_chip_collapsed', on ? '1' : '0'); }catch(e){}
  }
  // حالة محلية فقط — ثابتة بين الصفحات بدون session/nav
  var wasClosed = false;
  try{ wasClosed = localStorage.getItem('misran_chip_collapsed') === '1'; }catch(e){}
  applyCollapsed(wasClosed);
  document.getElementById('btnChipToggle').onclick=function(e){
    e.preventDefault(); e.stopPropagation();
    applyCollapsed(!chip.classList.contains('collapsed'));
  };


  document.getElementById('btnGear').onclick=function(){
    glassModal('الحساب والإعدادات',
      '<div class="glass-row mb-2"><div class="small text-muted mb-1">ID الحساب</div>'+idCopyHtml(deviceId())+'</div>'+
      '<div class="glass-row"><div class="small text-muted mb-1">تسجيل الدخول بـ ID آخر</div>'+
      '<input class="form-control mb-2" id="switchIdInput" placeholder="اكتب ID" style="direction:ltr">'+
      '<button type="button" class="btn btn-warning btn-sm" id="btnSwitchId">تأكيد</button></div>'+
      '<div class="glass-row mt-2"><button type="button" class="btn btn-outline-secondary btn-sm w-100" id="btnRestoreId">تفعيل ID الجهاز الأصلي</button></div>'
    );
    setTimeout(function(){ wireCopy(document.getElementById('glassBd')); },0);
    document.getElementById('btnSwitchId').onclick=function(){
      var v=(document.getElementById('switchIdInput').value||'').trim();
      if(!v){ toast('اكتب ID'); return; }
      if(!isValidSiteId(v)){ toast('لا وجود لهذا الـ ID'); return; }
      originalDeviceId();
      setActiveDeviceId(v);
      document.getElementById('glassBd').classList.remove('open');
      toast('تم تغيير الحساب');
      renderUserChip();
    };
    document.getElementById('btnRestoreId').onclick=function(){
      var o=originalDeviceId();

function isValidSiteId(id){
  id=String(id||'').trim();
  // algorithm: u_ + 32 hex from crypto random
  if(/^u_[a-f0-9]{32}$/i.test(id)) return true;
  // legacy shorter ids from older generator
  if(/^u_[a-z0-9]{10,}$/i.test(id)) return true;
  return false;
}

function markNav(){
  var path=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  if(!path||path==='/') path='index.html';
  document.querySelectorAll('.nav-pill-link').forEach(function(a){
    var href=(a.getAttribute('href')||'').split('?')[0].split('/').pop().toLowerCase();
    a.classList.toggle('is-active', href===path || (path===''&&href==='index.html'));
  });
  var ind=document.getElementById('navIndicator');
  var links=document.getElementById('navLinks');
  var a=document.querySelector('.nav-pill-link.is-active');
  if(!ind||!links) return;
  // إجبار الظهور (يتفوق على أي CSS قديم)
  ind.style.setProperty('display','block','important');
  ind.style.setProperty('visibility','visible','important');
  ind.style.setProperty('opacity','1','important');
  ind.style.setProperty('z-index','0','important');
  ind.style.setProperty('pointer-events','none','important');
  ind.style.setProperty('position','absolute','important');
  ind.style.setProperty('background','#c9a227','important');
  ind.style.setProperty('background-image','linear-gradient(145deg,#ffe9a8 0%,#f0d060 25%,#e8c547 50%,#c9a227 80%,#a67c00 100%)','important');
  ind.style.setProperty('border','none','important');
  ind.style.setProperty('box-shadow','0 3px 14px rgba(201,162,39,.45)','important');
  ind.style.setProperty('border-radius','999px','important');
  ind.style.setProperty('box-shadow','0 4px 18px rgba(201,162,39,.55)','important');

  function measure(){
    if(!a) return null;
    var lr=links.getBoundingClientRect();
    var ar=a.getBoundingClientRect();
    if(ar.width < 4) return null;
    return {
      left: Math.round(ar.left - lr.left + (links.scrollLeft||0)),
      top: Math.round(ar.top - lr.top + (links.scrollTop||0)),
      width: Math.round(ar.width),
      height: Math.round(ar.height)
    };
  }
  function setTransition(on){
    if(on){
      ind.style.setProperty('transition',
        'left .7s cubic-bezier(.22,1,.36,1), width .7s cubic-bezier(.22,1,.36,1), top .7s cubic-bezier(.22,1,.36,1), height .7s cubic-bezier(.22,1,.36,1)',
        'important');
    } else {
      ind.style.setProperty('transition','none','important');
    }
  }
  function applyPos(p){
    if(!p){ ind.style.width='0px'; return; }
    ind.style.left = p.left + 'px';
    ind.style.top = p.top + 'px';
    ind.style.width = p.width + 'px';
    ind.style.height = p.height + 'px';
  }

  var target = measure();
  var saved = null;
  try{
    var raw = sessionStorage.getItem('navInd');
    if(raw){
      var parts = raw.split('|');
      if(parts.length >= 4){
        saved = {
          left: parseFloat(parts[0])||0,
          width: parseFloat(parts[1])||0,
          top: parseFloat(parts[2])||0,
          height: parseFloat(parts[3])||0
        };
      }
      sessionStorage.removeItem('navInd');
    }
  }catch(e){}

  if(saved && saved.width > 4 && target){
    setTransition(false);
    applyPos(saved);
    void ind.offsetWidth;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        setTimeout(function(){
          setTransition(true);
          void ind.offsetWidth;
          applyPos(target);
        }, 60);
      });
    });
  } else if(target){
    setTransition(false);
    applyPos(target);
    void ind.offsetWidth;
  }
}

function navigateTo(href){
  var ind=document.getElementById('navIndicator');
  var links=document.getElementById('navLinks');
  var active=document.querySelector('.nav-pill-link.is-active');
  try{
    if(ind && links && active){
      var lr=links.getBoundingClientRect();
      var ar=active.getBoundingClientRect();
      sessionStorage.setItem('navInd', [
        Math.round(ar.left - lr.left + (links.scrollLeft||0)),
        Math.round(ar.width),
        Math.round(ar.top - lr.top + (links.scrollTop||0)),
        Math.round(ar.height)
      ].join('|'));
      sessionStorage.setItem('misran_nav_pending','1');
    }
  }catch(e){}
  try{ playCurtain(function(){ location.href=href; }); }catch(err){ location.href=href; }
}

function wireNav(){
  document.querySelectorAll('.nav-pill-link, .nav-pill-brand, a.btn-hero, a.btn-primary-custom').forEach(function(a){
    var href=a.getAttribute('href')||'';
    if(!href||href.indexOf('http')===0||href.charAt(0)==='#'||href.indexOf('mailto:')===0||href.indexOf('tel:')===0) return;
    a.addEventListener('click',function(e){
      var dest=href.split('?')[0].toLowerCase();
      var cur=(location.pathname.split('/').pop()||'index.html').toLowerCase();
      if(dest===cur) return;
      e.preventDefault(); navigateTo(href);
    });
  });
}

 توافق فتوقّف عن الاستخدام. يُفترض توفر الأهلية القانونية أو إشراف ولي الأمر حيث يلزم.</p><p><strong>الخدمة</strong></p><p>عرض منتجات رقمية ومحتوى وملفات وخدمات، مجانية أو مدفوعة، مع إمكانية تغيير القوائم والأسعار والعروض.</p><p><strong>معرّف الجهاز</strong></p><p>التفعيل يرتبط بمعرّف يظهر لك. أنت مسؤول عن سريته. النقل بين الأجهزة وفق ما تتيحه الإدارة فقط.</p><p><strong>الأسعار والدفع</strong></p><p>المعتمد هو الظاهر وقت العرض. الشراء شخصي. لا إعادة بيع دون إذن.</p><p><strong>الترخيص</strong></p><p>ترخيص استخدام شخصي غير حصري للمنتج المفعّل، دون إعادة توزيع أو ادّعاء ملكية.</p><p><strong>المحتوى</strong></p><p>للاستخدام المشروع. يُحظر إعادة النشر المضلل. الروابط الخارجية على مسؤوليتك.</p><p><strong>الاستخدام المقبول</strong></p><p>يُحظر مخالفة الأنظمة، الإضرار بالموقع، الانتحال، تجاوز التفعيل، وإساءة قنوات الدعم. للإدارة التقييد عند المخالفة.</p><p><strong>الملكية الفكرية</strong></p><p>العناصر الأصلية للمنصة محمية. التصفح لا ينقل الملكية.</p><p><strong>إخلاء المسؤولية</strong></p><p>الخدمة كما هي. لا ضمان لانقطاع صفري. المسؤولية في حدود ما يسمح به النظام.</p><p><strong>التعديل والإيقاف</strong></p><p>يحق التعديل أو إيقاف جزء من الخدمة. استمرار الاستخدام قبول للصيغة السارية.</p><p><strong>القانون</strong></p><p>تُفسَّر وفق الأنظمة ذات الصلة مع حفظ حقوق المستهلك الإلزامية. يُفضّل الحل الودي عبر الدعم أولاً.</p><p><strong>أحكام عامة</strong></p><p>بطلان بند لا يبطل الباقي. هذه الشروط مع سياسة الخصوصية هما الاتفاق بشأن موضوعهما.</p><p><strong>شرط تكميلي (1)</strong></p><p>يُؤكَّد أن العلاقة بين المستخدم ومنصة محرك مصران تقوم على حسن النية والوضوح. أي منتج رقمي يُعرض يخضع للوصف الظاهر عند التفعيل. المرجع MM-TERM-001. لا يُفسَّر سكوت الإدارة عن مخالفة على أنه تنازل دائم. يظل المستخدم مسؤولاً عن استخدام مشروع للمنتجات بما لا يعتدي على حقوق الغير أو سمعة المنصة.</p><p><strong>شرط تكميلي (2)</strong></p><p>يُؤكَّد أن العلاقة بين المستخدم ومنصة محرك مصران تقوم على حسن النية والوضوح. أي منتج رقمي يُعرض يخضع للوصف الظاهر عند التفعيل. المرجع MM-TERM-002. لا يُفسَّر سكوت الإدارة function ensureConsentUI(){
  if(document.getElementById('consentOverlay')) return;
  var ov=document.createElement('div'); ov.id='consentOverlay'; ov.className='consent-overlay';
  ov.innerHTML='<div class="consent-card" role="dialog" aria-modal="true">'+
    '<header><span id="consentTitle">مرحباً بك</span><span></span></header>'+
    '<div class="consent-body" id="consentBody"></div>'+
    '<div class="consent-footer" id="consentFooter"></div></div>';
  document.body.appendChild(ov);
}
function updateConfirmState(){
  var b=document.getElementById('consentConfirm');
  if(!b) return;
  var a=document.getElementById('ckPolicy');
  var t=document.getElementById('ckTerms');
  var v=document.getElementById('ckVideo');
  var ok=a&&t&&v&&a.checked&&t.checked&&v.checked;
  b.classList.toggle('ready', !!ok);
}
function openConsent(readonly){
  ensureConsentUI();
  var ov=document.getElementById('consentOverlay');
  document.getElementById('consentTitle').textContent = readonly ? 'السياسة والشروط' : 'مرحباً بك — يرجى الموافقة للمتابعة';
  document.getElementById('consentBody').innerHTML = buildConsentHTML(!!readonly);
  var foot=document.getElementById('consentFooter');
  if(readonly){
    foot.innerHTML='<button type="button" class="btn-confirm ready" id="consentCloseBtn" style="opacity:1;pointer-events:auto">إغلاق</button>';
    document.getElementById('consentCloseBtn').onclick=function(){ ov.classList.remove('open'); };
  } else {
    foot.innerHTML='<button type="button" class="btn-confirm" id="consentConfirm">تأكيد والمتابعة</button>';
    ['ckPolicy','ckTerms','ckVideo'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.addEventListener('change', updateConfirmState);
    });
    document.getElementById('consentConfirm').onclick=function(){
      if(!this.classList.contains('ready')) return;
      try{ localStorage.setItem('misran_consent_v1','1'); }catch(e){}
      ov.classList.remove('open');
    };
    updateConfirmState();
  }
  ov.classList.add('open');
}
function maybeShowFirstConsent(){
  try{
    if(localStorage.getItem('misran_consent_v1')==='1') return;
  }catch(e){}
  openConsent(false);
}

    btn.innerHTML='<i class="fas fa-chevron-down"></i>'; btn.title='إظهار القائمة';
    document.body.appendChild(btn);
  }
  var hidden=false, lastY=0, acc=0;
  function setHidden(on){
    hidden=!!on;
    wrap.classList.toggle('nav-hidden', hidden);
    btn.classList.toggle('visible', hidden);
  }
  btn.onclick=function(){ setHidden(false); window.scrollTo({top:0,behavior:'smooth'}); };
  window.addEventListener('scroll', function(){
    var y=window.scrollY||0;
    var dy=y-lastY;
    lastY=y;
    if(y<40){ setHidden(false); acc=0; return; }
    if(dy>6){ acc+=dy; if(acc>24) setHidden(true); }
    else if(dy<-8){ acc=0; setHidden(false); }
  }, {passive:true});
}



function initChrome(){
  try{ wireGoldenDownloads(document); }catch(e){}

  applyBrand();
  if(typeof renderUserChip==='function') renderUserChip();
  if(typeof renderFloatButtons==='function') renderFloatButtons();
  markNav(); wireNav(); setupNavScrollHide();
  if(typeof maybeShowFirstConsent==='function') maybeShowFirstConsent();
  var tg=document.getElementById('navToggle');
  if(tg) tg.onclick=function(){var n=document.getElementById('navLinks'); if(n) n.classList.toggle('open'); setTimeout(markNav,40);};
  window.addEventListener('resize',markNav);
  setTimeout(markNav,50);
  setTimeout(markNav,300);
  setTimeout(markNav,800);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){markNav();});
}
function paginate(list, page, per){
  var total=Math.max(1, Math.ceil(list.length/per)||1);
  page=Math.min(Math.max(1,page), total);
  return {items:list.slice((page-1)*per, page*per), page:page, total:total};
}
function renderPager(el, page, total, onPage){
  if(!el) return;
  if(total<=1){el.innerHTML='';return;}
  var html='<button type="button" '+(page<=1?'disabled':'')+' data-p="'+(page-1)+'">‹</button>';
  for(var i=1;i<=total;i++) html+='<button type="button" class="'+(i===page?'active':'')+'" data-p="'+i+'">'+i+'</button>';
  html+='<button type="button" '+(page>=total?'disabled':'')+' data-p="'+(page+1)+'">›</button>';
  el.innerHTML=html;
  el.querySelectorAll('button[data-p]').forEach(function(b){b.onclick=function(){if(!b.disabled) onPage(+b.getAttribute('data-p'));};});
}
document.addEventListener('DOMContentLoaded', function(){ initChrome(); });
</script>
